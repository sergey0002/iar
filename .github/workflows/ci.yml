name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # Основная матрица: юнит-тесты PHPUnit + интеграционные HTTP-сценарии.
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, exif, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Lint
        run: find src tests tools -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Unit tests (PHPUnit)
        run: vendor/bin/phpunit --testsuite unit

      - name: Integration tests (real HTTP through the built-in server)
        run: php tools/integration.php run

  # Портативный режим: ни composer, ни PHPUnit — только PHP.
  # Это сценарий продукта «положил папку и работает».
  portable:
    name: Portable (no composer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd
          coverage: none
          tools: composer:v2

      - name: Fetch runtime dependency only
        run: composer update --prefer-dist --no-interaction --no-progress --no-dev

      - name: Portable unit runner
        run: php tests/run.php

      - name: Portable coverage (100% gate)
        run: |
          php tools/coverage-portable.php build
          php tests/coverage-run.php
          php tools/integration.php run
          php tools/coverage-portable.php report 100

  # Покрытие PHPUnit + мутационное тестирование.
  coverage:
    name: Coverage & mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, exif
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: PHPUnit with coverage
        run: vendor/bin/phpunit --testsuite unit --coverage-clover clover.xml

      - name: Integration tests (adds entry-point coverage)
        run: |
          php tools/coverage-portable.php build
          php tools/integration.php run

      - name: Coverage gate (100% of src/ + index.php)
        run: php tools/coverage-gate.php clover.xml

      - name: Infection (MSI >= 90)
        run: vendor/bin/infection --threads=2 --min-msi=90 --min-covered-msi=90 --no-progress
        continue-on-error: true

  # Минимальная сборка GD: проверяем guard-ветки без WebP/AVIF/exif.
  minimal:
    name: Minimal GD (no webp/avif/exif)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: gd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Portable unit runner
        run: php tests/run.php

      - name: Integration tests
        run: php tools/integration.php run

  # Сборка с Imagick и AVIF: единственный джоб, где исполняются
  # строки, помеченные @codeCoverageIgnore.
  imagick:
    name: Imagick + AVIF (strict coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, exif, imagick
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Portable unit runner
        run: php tests/run.php

      - name: Integration tests
        run: php tools/integration.php run

      - name: Strict portable coverage (ignore-маркеры отключены)
        env:
          IAR_STRICT_COVERAGE: '1'
        run: |
          php tools/coverage-portable.php build
          php tests/coverage-run.php
          php tools/integration.php run
          php tools/coverage-portable.php report 100

  static-analysis:
    name: PHPStan & code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
